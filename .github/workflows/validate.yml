name: Validar e Sincronizar Base de Citações

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sincronizar dados/*.md para citacoes.json (em push na main)
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: node scripts/sync-markdown.mjs

      - name: Validar citacoes.json e sincronismo com Markdown
        run: node scripts/validate.mjs --check-sync

      - name: Publicar atualização de citacoes.json se houver mudanças
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet citacoes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add citacoes.json
            git commit -m "chore: sincronizar citacoes.json a partir de dados/*.md"
            git push
          else
            echo "citacoes.json já está atualizado."
          fi
